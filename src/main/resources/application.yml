# =================================================================
#                 API Gateway 공통 설정
# =================================================================

# Resilience4j 설정 추가
resilience4j:
  timelimiter:
    instances:
      # Circuit Breaker 이름과 동일하게 설정
      apiMgmtSvcCb:
        timeout-duration: 10s # 타임아웃 시간을 5초로 늘림
      userSvcCb:
        timeout-duration: 10s
      customApiMgmtSvcCb:
        timeout-duration: 10s

spring:
  application:
    name: api-gateway
  profiles:
    active: dev
  main:
    allow-circular-references: true
    # WebFlux 환경에서 Actuator 활성화
    web-application-type: reactive



  # Kafka 설정 - User Service와 동일 설정
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${SERVICE_NAME:api-gateway}-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        max.poll.records: 100
        session.timeout.ms: 30000
        heartbeat.interval.ms: 3000
      enable-auto-commit: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        acks: all
        retries: 3
        batch.size: 16384
        linger.ms: 5
        buffer.memory: 33554432
        compression.type: snappy
    listener:
      ack-mode: manual_immediate
    template:
      default-topic: user-service-events

  # Redis 설정 - User Service와 공유
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      timeout: 5000ms
      connect-timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: 3000ms
        shutdown-timeout: 100ms

  # OAuth2 / JWT 설정
  security:
    oauth2:
      # *** OAuth2 Client 설정 주석 처리됨 - User Service로 Auth0 로그인 처리 이전 ***
      # Auth0 OAuth2 로그인이 User Service로 이전되었습니다.
      # 롤백이 필요한 경우 아래 주석을 해제하세요.
      # client:
      #   registration:
      #     auth0:
      #       client-id: ${AUTH0_CLIENT_ID:}
      #       client-secret: ${AUTH0_CLIENT_SECRET:}
      #       authorization-grant-type: authorization_code
      #       redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
      #       scope:
      #         - openid
      #         - profile
      #         - email
      #   provider:
      #     auth0:
      #       issuer-uri: https://api-bridge.us.auth0.com/
      #       authorization-uri: https://api-bridge.us.auth0.com/authorize
      #       token-uri: https://api-bridge.us.auth0.com/oauth/token
      #       user-info-uri: https://api-bridge.us.auth0.com/userinfo
      #       jwk-set-uri: https://api-bridge.us.auth0.com/.well-known/jwks.json
      # OAuth2 Resource Server 완전 비활성화 - CustomJwtAuthenticationFilter 사용
      # resourceserver:
      #   jwt:
      #     issuer-uri: ${AUTH0_ISSUER_URI:https://api-bridge.us.auth0.com/}
      #     audience: ${AUTH0_AUDIENCE:https://ApiBridge/}  # Auth0 API Identifier




  # Cloud Gateway 설정
  cloud:
    gateway:
      default-filters:
        - name: Retry
          args:
            retries: 3
            statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
            methods: GET,POST,PUT,DELETE,HEAD
            backoff:
              first-backoff: 50ms
              max-backoff: 500ms
              factor: 2
        - AddRequestHeader=X-Gateway, api-gateway
        - RemoveRequestHeader=Cookie
        # - name: StandardResponseFilter  # 임시 비활성화 - 빈 응답 버그 수정 필요
        # - name: TokenRelay  # JWT 중복 검증 방지를 위해 임시 비활성화
        # JWT 토큰에서 사용자 정보를 헤더로 변환하는 필터
        - name: JwtUserHeaderFilter
        # 통합 Rate Limiting (모든 라우트에 기본 적용)
        - name: RequestRateLimiter
          args:
            rate-limiter: "#{@userServiceRateLimiter}"
            key-resolver: "#{@userKeyResolver}"
            deny-empty-key: false
      routes:
        # *** User operations under auth path - specific routes first ***
        # /auth/users/** 경로를 /api/users/** 로 라우팅 (JWT 검증 필요)
        - id: auth-users-routes
          uri: http://localhost:8081
          predicates:
            - Path=/auth/users/**
          filters:
            - name: RewritePath
              args:
                regexp: /auth/users/(?<segment>.*)
                replacement: /api/users/${segment}
            - AddRequestHeader=X-Gateway-Source, api-gateway-auth-users
            - name: CircuitBreaker
              args:
                name: userSvcCb
                fallback-uri: forward:/fallback/user-service # Fallback 비활성화

        # *** 새로 추가된 라우트: Auth0 인증 경로 (토큰 검증 없음) ***
        # /auth/** 경로는 토큰 검증 없이 User Service로 라우팅 (users는 별도 처리)
        - id: auth-routes-public
          uri: http://localhost:8081
          predicates:
            - Path=/auth/login,/auth/login-success,/auth/login-error,/auth/user-info,/auth/logout,/auth/logout-success,/auth/config
          filters:
            - name: RewritePath
              args:
                regexp: /auth/(?<segment>.*)
                replacement: /api/auth/${segment}
            # JWT 검증 필터 제외 - 공개 접근 허용
            - AddRequestHeader=X-Gateway-Source, api-gateway-auth
            - name: CircuitBreaker
              args:
                name: userSvcCb
                fallback-uri: forward:/fallback/user-service # Fallback 비활성화

        # OAuth2 경로를 User Service로 라우팅 (Auth0 OAuth2 처리)
        - id: oauth2-routes-public
          uri: http://localhost:8081
          predicates:
            - Path=/oauth2/**
          filters:
            - AddRequestHeader=X-Gateway-Source, api-gateway-oauth2
            - name: CircuitBreaker
              args:
                name: userSvcCb
                fallback-uri: forward:/fallback/user-service # Fallback 비활성화

        # OAuth2 콜백 경로를 User Service로 라우팅 (Auth0 콜백 처리)
        - id: oauth2-callback-routes-public
          uri: http://localhost:8081
          predicates:
            - Path=/login/oauth2/code/**
          filters:
            - AddRequestHeader=X-Gateway-Source, api-gateway-oauth2-callback
            - name: CircuitBreaker
              args:
                name: userSvcCb
                fallback-uri: forward:/fallback/user-service # Fallback 비활성화

        # User Service - 관리자 전용 경로
        - id: user-service-admin
          uri: http://localhost:8081
          predicates:
            - Path=/gateway/users/admin/** # Method Predicate를 제거하여 모든 메서드 허용
          filters:
            - name: RewritePath
              args:
                regexp: /gateway/users/admin/(?<segment>.*)
                replacement: /api/admin/${segment}
            - name: CircuitBreaker
              args:
                name: userSvcCb
                fallback-uri: forward:/fallback/user-service # Fallback 비활성화

        # User Service - GET, POST, PUT, DELETE, HEAD 요청
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/gateway/users/** # Method Predicate를 제거하여 모든 메서드 허용
          filters:
            - name: RewritePath
              args:
                regexp: /gateway/users/(?<segment>.*)
                replacement: /${segment}
            - AddRequestHeader=X-Gateway-Source, api-gateway
            - name: CircuitBreaker
              args:
                name: userSvcCb
                fallback-uri: forward:/fallback/user-service # Fallback 비활성화

        # Admin Service - 관리자 전용 경로
        - id: admin-service
          uri: http://localhost:8081
          predicates:
            - Path=/gateway/admin/**
          filters:
            - name: RewritePath
              args:
                regexp: /gateway/admin/(?<segment>.*)
                replacement: /api/admin/${segment}
            - name: CircuitBreaker
              args:
                name: userSvcCb
                fallback-uri: forward:/fallback/user-service # Fallback 비활성화

        # API Management - 관리자 전용 경로 (모든 HTTP method 허용)
        - id: api-management-admin
          uri: http://localhost:8082
          predicates:
            - Path=/gateway/apimgmt/admin/** # Method Predicate를 제거하여 모든 메서드 허용
          filters:
            - StripPrefix=2
            - name: CircuitBreaker
              args:
                name: apiMgmtSvcCb
                fallback-uri: forward:/fallback/api-management # Fallback 비활성화

        # API Management - 모든 HTTP method 허용
        - id: api-management-service
          uri: http://localhost:8082
          predicates:
            - Path=/gateway/apimgmt/** # Method Predicate를 제거하여 모든 메서드 허용
          filters:
            - StripPrefix=2
            - name: CircuitBreaker
              args:
                name: apiMgmtSvcCb
                fallback-uri: forward:/fallback/api-management

        # Custom API - 관리자 전용 경로
        - id: custom-api-admin
          uri: http://localhost:8083
          predicates:
            - Path=/gateway/customapi/admin/** # Method Predicate를 제거하여 모든 메서드 허용
          filters:
            - StripPrefix=2
            - name: CircuitBreaker
              args:
                name: customApiMgmtSvcCb
                fallback-uri: forward:/fallback/custom-api-management # Fallback 비활성화

        # Custom API - GET, POST, PUT, DELETE 요청
        - id: custom-api-management-service
          uri: http://localhost:8083
          predicates:
            - Path=/gateway/customapi/** # Method Predicate를 제거하여 모든 메서드 허용
          filters:
            - StripPrefix=2
            - name: CircuitBreaker
              args:
                name: customApiMgmtSvcCb
                fallback-uri: forward:/fallback/custom-api-management # Fallback 비활성화

        # 모니터링 서비스 라우트 (8084) - 관리자 전용
        - id: monitoring-service-local
          uri: http://localhost:8084
          predicates:
            - Path=/gateway/monitoring/** # Method Predicate를 제거하여 모든 메서드 허용
          filters:
            - StripPrefix=2
            # Monitoring Service Rate Limiting 활성화 (15req/s, 30 burst)
            - name: CircuitBreaker
              args:
                name: monitoringSvcCb
                fallback-uri: forward:/fallback/monitoring # Fallback 비활성화

        # AI Feature Service - Gateway 표준 라우팅 (/gateway/aifeature/**)
        - id: ai-feature-service
          uri: http://localhost:8085
          predicates:
            - Path=/gateway/aifeature/** # Method Predicate를 제거하여 모든 메서드 허용
          filters:
            - name: RewritePath
              args:
                regexp: /gateway/aifeature/(?<segment>.*)
                replacement: /${segment}
            - AddRequestHeader=X-Gateway-Source, api-gateway
            # - name: CircuitBreaker
            #   args:
            #     name: aiFeatureSvcCb
            #     fallback-uri: forward:/fallback/ai-feature

        # AI 서비스 라우트 (POST /ai/analyze-query-form) - 레거시 직접 접근
        - id: ai-service-analyze-query-form
          uri: http://localhost:8085
          predicates:
            - Path=/ai/** # Method Predicate를 제거하여 모든 메서드 허용
          filters:
            - name: RewritePath
              args:
                regexp: /ai/(?<segment>.*)
                replacement: /api/ai/${segment}
            - name: CircuitBreaker
              args:
                name: aiSvcCb
                # fallback-uri: forward:/fallback/ai-service # Fallback 비활성화

        # 커스텀 API 사용 라우트 (GET /custom/apiName={커스텀API이름})
        - id: ai-service-custom-api-usage
          uri: http://localhost:8085
          predicates:
            - Path=/custom/** # Method Predicate를 제거하여 모든 메서드 허용
          filters:
            - name: CircuitBreaker
              args:
                name: aiSvcCb
                # fallback-uri: forward:/fallback/ai-service # Fallback 비활성화

# 서버 설정
server:
  port: ${SERVER_PORT:8080}

# Redis 활성화
redis:
  enabled: ${REDIS_ENABLED:true}

# Rate Limiting 설정
rate-limit:
  default:
    replenish-rate: 50      # 초당 50개 요청 허용
    burst-capacity: 100     # 버스트 100개 허용
    requested-tokens: 1     # 요청당 1토큰

# Kafka 설정
kafka:
  enabled: ${KAFKA_ENABLED:true}

# Gateway 로깅 설정
gateway:
  logging:
    enabled: ${GATEWAY_LOGGING_ENABLED:false}

# 로깅 설정
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# Auth0 설정 (JWT 검증용 - API Identifier를 audience로 사용)
auth0:
  audience: ${AUTH0_AUDIENCE:fzwFru3aG5pUJWsofqjxXxbYmWfzrnFX}  # Auth0 Client ID (실제 JWT의 aud 값)
  issuerUri: ${AUTH0_ISSUER_URI:https://dev-q64r0n0blzhir6y0.us.auth0.com/}
  # *** OAuth2 Client 설정 주석 처리됨 - User Service로 Auth0 로그인 처리 이전 ***
  # client-id: ${AUTH0_CLIENT_ID:}
  # logout-redirect-uri: ${AUTH0_LOGOUT_REDIRECT_URI:http://localhost:8081/api/auth/logout-success}
  # postLogoutUri: ${AUTH0_POST_LOGOUT_URI:http://localhost:8081/public/auth-test.html}

# JWT Test Mode 설정 (개발/테스트용)
jwt:
  test-mode: ${JWT_TEST_MODE:false}


# 관리 엔드포인트 - 모니터링용은 공개, 나머지는 관리자 전용
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway,circuitbreakers,env,beans,configprops
      base-path: /actuator
  endpoint:
    health:
      show-details: always
    info:
      enabled: true
    metrics:
      enabled: true
    prometheus:
      enabled: true
    gateway:
      enabled: true
    circuitbreakers:
      enabled: true