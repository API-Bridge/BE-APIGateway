services:
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: APIBridge-Gateway
    ports:
      - "8080:8080"
    environment:
      # Spring profiles
      - SPRING_PROFILES_ACTIVE=prod
      
      # Bind to all network interfaces within the container
      - SERVER_ADDRESS=0.0.0.0
      - SERVER_PORT=8080
      # Force IPv4 stack
      - JAVA_OPTS=-Djava.net.preferIPv4Stack=true -XX:+UseContainerSupport -XX:MaxRAMPercentage=70.0 -XX:+UseG1GC
      
      # Redis configuration (기존 외부 Redis 컨테이너 사용)
      - SPRING_REDIS_HOST=APIBridge-Redis
      - SPRING_REDIS_PORT=6379
      - SPRING_REDIS_TIMEOUT=2000ms
      
      # Auth0 설정 (.env 파일에서 로드)
      - AUTH0_ISSUER_URI=${AUTH0_ISSUER_URI}
      - AUTH0_AUDIENCE=${AUTH0_AUDIENCE}
      - AUTH0_CLIENT_ID=${AUTH0_CLIENT_ID}
      - AUTH0_CLIENT_SECRET=${AUTH0_CLIENT_SECRET}
      - AUTH0_LOGOUT_REDIRECT_URI=${AUTH0_LOGOUT_REDIRECT_URI}
      
      # Microservices URLs (실제 Docker 컨테이너 이름으로 연결)
      - USER_SERVICE_URL=http://usersvc-user-service-1:8081
      - API_MGMT_SERVICE_URL=http://apimanagementsvc-apimanagement-service-1:8082
      - CUSTOM_API_SERVICE_URL=http://custom-api-svc:8083
      - AI_FEATURE_SERVICE_URL=http://aisvc-ai-service-1:8085
      - SYS_MGMT_SERVICE_URL=http://systemmanagementsvc-system-management-service-1:8084
      
      # ELK 및 Kafka 설정 (Gateway Logging 완전 비활성화)
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=systemmanagementsvc-kafka-1:9092
      - GATEWAY_LOGGING_ENABLED=false
      - GATEWAY_LOG_TOPIC=logs.gateway
      - GATEWAY_MASK_SENSITIVE_DATA=true
      
      # Redis/Kafka 활성화 (Kafka는 일시적으로 비활성화)
      - redis.enabled=true
      - kafka.enabled=false
      
      
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - external-services
      - apimanagementsvc_microservices-network
      - usersvc_app-network
      - customapisvc_app-network
      - systemmanagementsvc_app-network

networks:
  # 기존 서비스들이 실행 중인 외부 네트워크들에 연결
  external-services:
    external: true
  apimanagementsvc_microservices-network:
    external: true
  usersvc_app-network:
    external: true
  customapisvc_app-network:
    external: true
  systemmanagementsvc_app-network:
    external: true